# Manifiesto del conector del medidor de energía (PM2130) del tablero del LabECA.
# Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E1-PB-LECA-TAB01"
version = "0.1.0"
sdk     = ">=1,<2"
autores = ["francobroggi", "tomasvidela11", "santicianflone"]
clase   = "conector:ConectorTableroAula"

# Un bloque por cada campo que manda el firmware en "values", con la unidad en el nombre y su
# rango físico. Lo que no esté acá, o esté fuera de rango, AURA no lo guarda.
# Los rangos tienen que coincidir con los límites del firmware y con la ficha del dispositivo.

# ---- Obligatorios (fase A) ----
[campos.v_an_v]
unidad = "V"
min = 0
max = 300

[campos.i_a_a]
unidad = "A"
min = 0
max = 120            # TI de 100/5 A, con margen de sobrecarga

[campos.p_w]
unidad = "W"
min = -30000         # negativa: energía hacia la red (en un aula, señal de TI invertido)
max = 30000

[campos.cosphi_a]
unidad = "adimensional"
min = 0
max = 1

# ---- Opcionales (el firmware los manda solo si están habilitados) ----
[campos.tanphi]
unidad = "adimensional"   # Q/P total: positivo inductivo, negativo capacitivo
min = -10
max = 10

[campos.thd_v_an_pct]
unidad = "%"
min = 0
max = 100

[campos.thd_i_a_pct]
unidad = "%"
min = 0
max = 500            # con cargas electrónicas puede superar el 100 %

[campos.e_act_kwh]
unidad = "kWh"
min = 0
max = 1000000000

# ---- Fases B y C ----
# El aula es monofásica: el firmware las tiene, pero no las envía (ENVIAR_FASES_BC = 0).
# Si algún día se habilitan, descomentar estos bloques en el mismo PR.
