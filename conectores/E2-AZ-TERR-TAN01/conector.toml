# Manifiesto del conector de E2-AZ-TERR-TAN01 (nivel de 3 tanques de agua, terraza del Edificio 2).
# Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E2-AZ-TERR-TAN01"            # igual a la carpeta
version = "0.1.0"
sdk     = ">=1,<2"
autores = ["forzanijuan22", "AlejoRacca", "Agucesano"]   # usuarios de GitHub del grupo
clase   = "conector:ConectorTanques"

# Por tanque, dos campos. Los nombres tienen que coincidir con los que devuelve el codec
# (dispositivos/E2-AZ-TERR-TAN01/codec.js).
#
# distancia_tanqueN_cm: distancia del sensor ultrasónico al agua, en cm con un decimal. Más agua =
# menos distancia. El rango es el que valida el firmware (250 a 6000 mm). 25 quiere decir
# "25 cm o menos": el agua en la zona ciega del sensor, tanque lleno.
#
# nivel_tanqueN_pct: nivel de agua en %, con un decimal, calculado en el nodo con el cero y el
# lleno del tanque (set_config). Solo llega si el tanque está calibrado.
[campos.distancia_tanque1_cm]
unidad = "cm"
min = 25
max = 600

[campos.distancia_tanque2_cm]
unidad = "cm"
min = 25
max = 600

[campos.distancia_tanque3_cm]
unidad = "cm"
min = 25
max = 600

[campos.nivel_tanque1_pct]
unidad = "%"
min = 0
max = 100

[campos.nivel_tanque2_pct]
unidad = "%"
min = 0
max = 100

[campos.nivel_tanque3_pct]
unidad = "%"
min = 0
max = 100
