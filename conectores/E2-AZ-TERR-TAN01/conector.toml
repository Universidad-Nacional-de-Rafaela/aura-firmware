# Manifiesto del conector de E2-AZ-TERR-TAN01 (nivel de 3 tanques de agua, terraza del Edificio 2).
# Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E2-AZ-TERR-TAN01"            # igual a la carpeta
version = "0.1.0"
sdk     = ">=1,<2"
autores = ["forzanijuan22", "AlejoRacca", "Agucesano"]   # usuarios de GitHub del grupo
clase   = "conector:ConectorTanques"

# Un campo por tanque: la distancia del sensor ultrasónico al agua, en cm con un decimal. Más
# agua = menos distancia. El rango es el mismo que valida el firmware (DIST_MIN_MM y DIST_MAX_MM
# de E2-AZ-TERR-TAN01.ino, 250 a 6000 mm): un valor fuera de acá no se guarda. 25 quiere decir
# "25 cm o menos": el agua en la zona ciega del sensor, tanque lleno. Los nombres tienen que
# coincidir con los que devuelve el codec (dispositivos/E2-AZ-TERR-TAN01/codec.js).
[campos.distancia_tanque1_cm]
unidad = "cm"
min = 25
max = 600

[campos.distancia_tanque2_cm]
unidad = "cm"
min = 25
max = 600

[campos.distancia_tanque3_cm]
unidad = "cm"
min = 25
max = 600
