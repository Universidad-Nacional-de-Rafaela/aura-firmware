# Manifiesto del conector. Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E1-PB-LECA-CRT01"            # igual a la carpeta
version = "0.1.0"
sdk     = ">=1.2,<2"
autores = ["Facundo-Boide"]
clase   = "conector:ConectorCortina"

# Campos que manda el firmware de la cortina (aura-cortina).
[campos.posicion_pct]
unidad   = "%"
min      = 0
max      = 100
etiqueta = "Apertura de cortina"
rol      = "principal"

[campos.luz_lux]
unidad   = "lx"
min      = 0
max      = 65535
etiqueta = "Luz ambiental"
rol      = "principal"

[campos.estado_motor]
unidad   = "estado"
min      = 0
max      = 2
etiqueta = "Estado del motor"
rol      = "auxiliar"

[campos.modo]
unidad   = "modo"
min      = 0
max      = 2
etiqueta = "Modo de control"
rol      = "auxiliar"
