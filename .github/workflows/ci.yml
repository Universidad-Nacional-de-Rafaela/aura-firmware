name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Placa de la mesh. Un sketch para otra placa (LoRaWAN en XIAO ESP32S3) trae su fqbn.txt.
  FQBN: esp32:esp32:nologo_esp32c3_super_mini:CDCOnBoot=cdc
  ESP32_CORE: esp32:esp32@3.3.11
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  secretos:
    name: Sin secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ningún archivo de configuración local versionado
        run: |
          prohibidos=$(git ls-files | grep -E '(^|/)(config_local\.h|credenciales\.h|\.env)$' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Estos archivos no se versionan (este repo es público):"
            echo "$prohibidos"
            exit 1
          fi
      # Reglas propias en .gitleaks.toml: las de por defecto no detectan claves de WiFi ni de LoRaWAN.
      - name: gitleaks sobre toda la historia
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  nombres:
    name: Códigos de dispositivos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dispositivos/ respeta el mapa
        run: python3 herramientas/validar_dispositivos.py

  tests-host:
    name: Tests de host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests de comun/, de infraestructura/, de herramientas/ y de cada dispositivo que los tenga
        run: |
          for mk in comun/tests/Makefile infraestructura/*/tests/Makefile herramientas/tests/Makefile dispositivos/*/tests/Makefile; do
            [ -f "$mk" ] || continue
            echo "== $(dirname "$mk") =="
            make -C "$(dirname "$mk")"
          done

  conectores:
    name: Conectores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: aura_sdk
        run: python3 -m unittest discover -s comun/python/tests -v
      - name: Manifiestos y clases
        run: python3 herramientas/validar_conectores.py
      - name: Tests de cada conector
        run: |
          for t in ejemplos/*conector*/tests conectores/*/tests; do
            [ -d "$t" ] || continue
            echo "== $t =="
            python3 -m unittest discover -s "$t" -v
          done

  compilar:
    name: Compilar sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: autocontenido/ está al día
        run: |
          herramientas/generar_autocontenidos.sh
          if [ -n "$(git status --porcelain autocontenido)" ]; then
            echo "::error::autocontenido/ no coincide con las fuentes. Correr herramientas/generar_autocontenidos.sh y commitear."
            git status --porcelain autocontenido
            exit 1
          fi
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ESP32_CORE }}-${{ hashFiles('**/bibliotecas.txt') }}
      - name: Core ESP32 y bibliotecas
        run: |
          arduino-cli config init --overwrite --additional-urls "$ESP32_INDEX"
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          libs=$(cat infraestructura/*/bibliotecas.txt dispositivos/*/bibliotecas.txt ejemplos/*/bibliotecas.txt 2>/dev/null \
                 | sed 's/#.*//' | tr -d '\r' | awk 'NF' | sort -u)
          if [ -n "$libs" ]; then
            echo "$libs" | xargs -d '\n' arduino-cli lib install
          fi
      - name: Compilar
        run: |
          fallos=0
          for sketch in infraestructura/*/ dispositivos/*/ ejemplos/*/ herramientas/*/ autocontenido/*/; do
            nombre=$(basename "$sketch")
            [ -f "$sketch/$nombre.ino" ] || continue
            fqbn="$FQBN"
            [ -f "$sketch/fqbn.txt" ] && fqbn=$(tr -d ' \r\n' < "$sketch/fqbn.txt")
            echo "::group::$sketch ($fqbn)"
            if ! arduino-cli compile --fqbn "$fqbn" "$sketch"; then
              echo "::error::No compila: $sketch"
              fallos=1
            fi
            echo "::endgroup::"
          done
          exit $fallos
